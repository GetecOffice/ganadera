{% load static %}


{% block body %}
<style>
    .cancelado {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
    }

    .imagen-cancelada {
        max-width: 300px;
        width: 100%;
        height: auto;
        margin-bottom: 20px;
        opacity: 0.8;
        transition: transform 0.3s ease;
    }

    .imagen-cancelada:hover {
        transform: scale(1.05);
        opacity: 1;
    }

    .mensaje-cancelado {
        font-size: 1.25rem;
        color: #dc3545;
        /* rojo Bootstrap */
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .mensaje-cancelado i {
        color: #dc3545;
    }
</style>

{% if ServiciosWeb.Servicio == False  %}

<div class="container">
    <div class="cancelado mt-5">
        <img src="{% static 'images/catalogos/servicio cancelado.png' %}" alt="Servicio cancelado"
            class="imagen-cancelada">
        <div class="mensaje-cancelado mt-3">
            <i class="fa fa-ban"></i><i class="fa fa-close"></i>
            No hay servicio
            <i class="fa fa-close"></i><i class="fa fa-ban"></i>
        </div>
    </div>
</div>

{% else %}
<script>
    window.location.href = "{% url 'aplicacion:Menu_Presentacion' %}";
</script>
{% endif %}
{% endblock %}
