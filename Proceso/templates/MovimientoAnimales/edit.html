{% extends "base.html" %}
{% load static %}
{% block title %}CLIENTE{% endblock %}
{% block body %}
<!--**********************************
            Content body start
        ***********************************-->
{% block head %}PROCESO{% endblock %}
<div class="content-body">
    <div class="container-fluid">
        <div class="row" style="padding-right: 0 !important;">
            <div class="col-sm-12 col-xl-12 col-xxl-12" style="padding-right: 0 !important;">
                <div class="card">
                    <div class="card-header d-block d-sm-flex border-0">
                        <div class="me-3">
                            <h4 class="card-title mb-2">
                                <a href="{% url 'catalogo:T_Cliente'%}">
                                    <i class="bi bi-arrow-left-circle text-black fs-28"></i>
                                </a>
                                <b>EDITAR MOVIMIENTOS ANIMALES # {{ TMovimientoAnimales.Folio }}</b>
                            </h4>
                        </div>
                    </div>
                    <hr>
                    <div class="card-body tab-content px-4 pt-2">
                        <div class="tab-pane active show fade" id="monthly" role="tabpanel">
                            <form action="{% url 'proceso:A_Movimiento_Animal'%}" method="POST" autocomplete="off">
                                {% csrf_token %}
                                <div class="form-group">
                                    <input type="hidden" name="id" value="{{TMovimientoAnimales.ID}}">
                                    <input type="hidden" name="folio" value="{{TMovimientoAnimales.Folio}}">
                                    <input type="hidden" class="form-control" name="tecnico"
                                        value="{{ user.first_name }} {{user.last_name}}">
                                    <div class="row">
                                        <div class="col-sm-12 col-md-12 col-lg col-xl mb-3">
                                            <h6 class="h6-form">CLIENTE <label>*</label></h6>
                                            <select class="select2 form-control col-12" name="cliente" required>
                                                <option value="{{FiltradoCliente.ID}}">
                                                    --------{{FiltradoCliente.Nombre}}--------
                                                </option>
                                                {% for cliente in FECliente %}
                                                <option value="{{ cliente.ID }}">{{ cliente.Nombre }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>

                                        <div class="col-sm-12 col-md-12 col-lg col-xl mb-3">
                                            <h6 class="h6-form">FECHA <label>*</label></h6>
                                            <input type="date" name="fecha" value="{{fecha|date:'Y-m-d'}}"
                                                class="form-control" required>
                                        </div>
                                    </div>
                                    <div class="form-group ml-1 mr-1">
                                        <button type="submit"
                                            class="btn btn-success buttonEnviar celular">ACTUALIZAR</button>
                                        <a href="{% url 'proceso:T_MovAnimales' %}"
                                            class="btn btn-danger buttonCancelar celular" role="button">CANCELAR</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
